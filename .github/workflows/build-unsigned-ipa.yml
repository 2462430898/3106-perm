name: Build unsigned IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -q 3106-src.zip
      - name: Build
        run: xcodebuild -project 3106.xcodeproj -scheme 3106 -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/3106.app Payload/
          zip -r 3106.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3106-unsigned-ipa
          path: 3106.ipa
