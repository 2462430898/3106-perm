name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -q 3106-src.zip

      - name: Build
        working-directory: 3106src
        run: |
          xcodebuild -version
          xcodebuild -project ThreeOneOSSix.xcodeproj -scheme 3106 \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: 3106src
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/3106.app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "3106-3.1.13-perm-unsigned.ipa" Payload
          ls -lh "3106-3.1.13-perm-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3106-unsigned-ipa
          path: 3106src/3106-3.1.13-perm-unsigned.ipa
